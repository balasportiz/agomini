name: agomoni-run

services:
  postgres:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      target: migration
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        IMGPROXY_PUBLIC_URL: ${IMGPROXY_PUBLIC_URL}
    restart: "no"
    # Local development may leave Payload's batch=-1 schema-push marker.
    # Feed the confirmation explicitly because Compose one-shot services have no TTY.
    command: ["sh", "-c", "printf 'y\\n' | pnpm migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_ROOT: /mnt/data/photos
      APP_INTERNAL_URL: http://app:3000
    volumes:
      - ./storage/photos:/mnt/data/photos
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        IMGPROXY_PUBLIC_URL: ${IMGPROXY_PUBLIC_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_ROOT: /mnt/data/photos
      APP_INTERNAL_URL: http://app:3000
    ports:
      - "3000:3000"
    volumes:
      - ./storage/photos:/mnt/data/photos
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Automated local Postgres backups (open-source, MIT licensed, no cloud
  # dependency). Dumps run on the schedule below straight to ./storage/backups
  # on the host, with old backups rotated out automatically. See
  # https://github.com/prodrigestivill/docker-postgres-backup-local
  pgbackups:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    user: postgres:postgres
    volumes:
      - ./storage/backups:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    depends_on:
      postgres:
        condition: service_healthy

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.0
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_ALLOWED_SOURCES: http://app:3000
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_CACHE_USE: fs
      IMGPROXY_CACHE_FS_ROOT: /var/cache/imgproxy
    ports:
      - "8080:8080"
    volumes:
      - imgproxy_cache:/var/cache/imgproxy
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["production"]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      IMAGE_DOMAIN: ${IMAGE_DOMAIN:-images.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      imgproxy:
        condition: service_healthy

volumes:
  postgres_data:
  imgproxy_cache:
  caddy_data:
  caddy_config:
