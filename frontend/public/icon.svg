<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agomoni Run">
  <title>Agomoni Run</title>
  <defs>
    <linearGradient id="agomoni-tile" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F15A34"/>
      <stop offset="1" stop-color="#BC3A1D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#agomoni-tile)"/>
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="#FAF6F1" stroke-opacity="0.16" stroke-width="4"/>
  <!-- Sindoor / third-eye dot: nods to Maa Durga's arrival (Agomoni) -->
  <circle cx="256" cy="92" r="29" fill="#E7B24E"/>
  <!-- "A" for Agomoni, drawn as two forward strides -->
  <g stroke="#FAF6F1" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 150 L150 402"/>
    <path d="M256 150 L362 402"/>
  </g>
  <!-- Gold crossbar: the running / motion line -->
  <path d="M197 322 L315 322" stroke="#E7B24E" stroke-width="46" stroke-linecap="round"/>
</svg>
