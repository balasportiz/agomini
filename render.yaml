services:
  - type: web
    name: agomoni-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render injects PORT automatically — the Dockerfile accepts it via ENV PORT=3000
    # Build args bake NEXT_PUBLIC_* vars into the Next.js bundle at build time.
    # All other env vars (DATABASE_URL, PAYLOAD_SECRET, S3_*, etc.) are set in
    # the Render dashboard under Environment → Environment Variables.
    buildArgs:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://agomonirun.com
      - key: IMGPROXY_PUBLIC_URL
        value: http://localhost:8080                  # leave as default — imgproxy not used with R2
    healthCheckPath: /api/health
    # Free plan — spins down after 15 min of inactivity, wakes on next request (~30s)
    plan: free
    autoDeploy: true  # redeploys automatically on every push to the connected branch
